<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TuringOS Bazaar</title>
<meta name="description" content="The signed tool catalogue for TuringOS: MCP servers, one command away." />
<link rel="icon" href="logo.png" type="image/png" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="styles.css" />
<script>
  // Follow the system theme; the design language ships both dark and light.
  try {
    if (window.matchMedia('(prefers-color-scheme: light)').matches) {
      document.documentElement.dataset.theme = 'light';
    }
  } catch (e) { /* stay dark */ }
</script>
</head>
<body>
<header class="top">
  <a class="brand" href="./">
    <img class="brand-mark" src="logo.png" alt="" width="28" height="28" />
    <span class="brand-name">TuringOS <span class="brand-sub">Bazaar</span></span>
  </a>
  <div class="search">
    <input id="q" type="search" placeholder="Search tools, tags, categories" aria-label="Search tools" autocomplete="off" />
  </div>
  <nav class="cats" id="cats" aria-label="Categories"></nav>
</header>
<main>
  <section class="hero">
    <h1>Tools for your agents.</h1>
    <p>A signed catalogue of Model Context Protocol servers. Every index is checked against the Bazaar key before anything installs.</p>
    <code class="install-cmd">npx turingos-bazaar install &lt;id&gt;</code>
  </section>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>Nothing matches that yet.</p>
</main>
<dialog id="modal" aria-labelledby="mName">
  <article class="modal-card">
    <button class="close" id="closeModal" aria-label="Close">×</button>
    <h2 id="mName"></h2>
    <p class="mDesc" id="mDesc"></p>
    <div class="mMeta" id="mMeta"></div>
    <div class="mEnv" id="mEnv"></div>
    <div class="mInstall">
      <code id="mCmd"></code>
      <button id="copyCmd">Copy</button>
    </div>
  </article>
</dialog>
<footer>
  <p>TuringOS Bazaar · <a href="https://github.com/uncoalesced/turingos-bazaar">GitHub</a> · <a href="https://github.com/uncoalesced/TuringOS">TuringOS</a> · MIT</p>
</footer>
<script src="app.js"></script>
</body>
</html>
