<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="turingos-bazaar: MCP servers, one command away">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.45" stop-color="#c10801"/>
      <stop offset="0.75" stop-color="#f16001"/>
      <stop offset="1" stop-color="#d9c3ab"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#e85002" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e85002" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e85002"/>
      <stop offset="1" stop-color="#f16001"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" rx="18" fill="#000000"/>
  <rect width="1280" height="320" rx="18" fill="url(#glow)"/>
  <rect x="0" y="312" width="1280" height="8" fill="url(#brand)"/>

  <!-- stall grid: registry entries as tiles -->
  <g transform="translate(860 64)" stroke="#333333" stroke-width="1.5" fill="#0d0d0d">
    <rect x="0" y="0" width="104" height="56" rx="8"/>
    <rect x="120" y="0" width="104" height="56" rx="8"/>
    <rect x="240" y="0" width="104" height="56" rx="8"/>
    <rect x="0" y="72" width="104" height="56" rx="8"/>
    <rect x="120" y="72" width="104" height="56" rx="8" stroke="url(#border)" stroke-width="2.5" fill="#1a0a03"/>
    <rect x="240" y="72" width="104" height="56" rx="8"/>
    <rect x="0" y="144" width="104" height="56" rx="8"/>
    <rect x="120" y="144" width="104" height="56" rx="8"/>
    <rect x="240" y="144" width="104" height="56" rx="8"/>
  </g>
  <g transform="translate(860 64)" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="15" fill="#646464" text-anchor="middle">
    <text x="52" y="33">github</text>
    <text x="172" y="33">postgres</text>
    <text x="292" y="33">slack</text>
    <text x="52" y="105">fetch</text>
    <text x="172" y="105" fill="#f9f9f9">your-mcp</text>
    <text x="292" y="105">memory</text>
    <text x="52" y="177">sqlite</text>
    <text x="172" y="177">brave</text>
    <text x="292" y="177">git</text>
  </g>

  <text x="72" y="96" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="16" letter-spacing="3" fill="#e85002">TURINGOS · BAZAAR</text>
  <text x="72" y="164" font-family="'Timeless Serif','Iowan Old Style',Georgia,serif" font-size="64" fill="#f9f9f9">turingos-bazaar</text>
  <text x="72" y="204" font-family="'Timeless Sans',system-ui,'Segoe UI',sans-serif" font-size="22" fill="#a7a7a7">MCP servers, one command away. Signed, cached, local.</text>

  <rect x="72" y="232" width="470" height="44" rx="8" fill="#141413" stroke="#333333"/>
  <text x="92" y="260" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="17" fill="#f9f9f9"><tspan fill="#e85002">$</tspan> npx turingos-bazaar search github</text>
</svg>
