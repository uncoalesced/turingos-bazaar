# Engineered by uncoalesced
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm test
      - run: npm run validate
      - run: npm run build:web

  validate-and-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Entries and Build Index
        run: |
          sudo apt-get update -qq && sudo apt-get install -y jq
          chmod +x scripts/build_index.sh
          ./scripts/build_index.sh

      - name: Verify Index Exists
        run: |
          test -f dist/v1/index.json || { echo "dist/v1/index.json missing"; exit 1; }
          jq . dist/v1/index.json > /dev/null

      - name: Sign Index with Ed25519
        run: |
          chmod +x scripts/sign_index.sh
          ./scripts/sign_index.sh
        env:
          BAZAAR_SIGNING_KEY: ${{ secrets.BAZAAR_SIGNING_KEY }}
